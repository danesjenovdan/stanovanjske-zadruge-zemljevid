[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stanovanje-zadruge-zemljevid"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "Django==6.1.3",
    "psycopg2-binary==2.9.13",
    "boto3==1.43.127",
    "django-storages==1.14.6",
    "djangorestframework==3.18.3",
    "gunicorn==27.0.1",
    "django-cors-headers==4.9.0",
    "django-debug-toolbar==8.0.0",
    "djangorestframework==3.18.3",
    "entropy-based-binning==0.0.1",
    "mailchimp-marketing==3.0.80",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "django-stubs==5.2.2",
    "django-stubs-ext==6.1.2",
    "ipython==9.18.1",
    "isort",
]

[tool.setuptools.packages.find]
include = ["api*", "lestvica*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
